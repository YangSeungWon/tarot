<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>타로 카드 뽑기</title>
<meta name="description" content="라이더-웨이트 78장 풀덱으로 보는 타로. 원 카드, 쓰리 카드, 켈틱 크로스.">
<link rel="canonical" href="https://tarot.ysw.kr/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tarot.ysw.kr/">
<meta property="og:title" content="타로 카드 뽑기">
<meta property="og:description" content="부채꼴로 펼쳐진 덱에서 직접 카드를 뽑아보세요.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="cardback" viewBox="0 0 120 204">
    <rect width="120" height="204" fill="#1a1330"/>
    <rect x="4" y="4" width="112" height="196" fill="none" stroke="#c9a227" stroke-width="1" opacity=".85"/>
    <rect x="8.5" y="8.5" width="103" height="187" fill="none" stroke="#c9a227" stroke-width=".5" opacity=".5"/>
    <g transform="translate(60 102)" stroke="#c9a227" fill="none">
      <circle r="30" stroke-width=".6" opacity=".55"/>
      <circle r="21" stroke-width=".6" opacity=".75"/>
      <circle r="7"  stroke-width=".8" opacity=".9"/>
      <g stroke-width=".7" opacity=".8">
        <path d="M0-30 8-8 30 0 8 8 0 30 -8 8 -30 0 -8-8Z"/>
        <path d="M0-30 8-8 30 0 8 8 0 30 -8 8 -30 0 -8-8Z" transform="rotate(45) scale(.72)"/>
      </g>
      <g stroke-width=".4" opacity=".45">
        <path d="M0-44V-34M0 34v10M-44 0h10M34 0h10"/>
      </g>
      <circle r="2" fill="#c9a227" stroke="none" opacity=".9"/>
    </g>
    <g fill="#c9a227" opacity=".7">
      <circle cx="14" cy="14" r="1.6"/><circle cx="106" cy="14" r="1.6"/>
      <circle cx="14" cy="190" r="1.6"/><circle cx="106" cy="190" r="1.6"/>
    </g>
  </symbol>
</svg>

<header class="masthead">
  <h1 class="wordmark"><span class="wordmark-ko">타로</span><span class="wordmark-en">Tarot</span></h1>
</header>

<main>
  <section class="table" aria-labelledby="table-h">
    <h2 id="table-h" class="sr-only">카드 뽑기</h2>

    <div class="ask">
      <select class="ask-cat" id="ask-cat" aria-label="주제 고르기">
        <option value="">주제</option>
      </select>
      <input class="ask-q" id="ask-q" type="text" maxlength="60" autocomplete="off"
             placeholder="무엇에 대해 보시나요?" aria-label="질문 적기">
    </div>

    <div class="spreadbar" role="group" aria-label="스프레드 선택">
      <button class="spread-btn is-on" data-spread="one" type="button">
        <span class="spread-n">1</span><span class="spread-name">원 카드</span></button>
      <button class="spread-btn" data-spread="three" type="button">
        <span class="spread-n">3</span><span class="spread-name">쓰리 카드</span></button>
      <button class="spread-btn" data-spread="act" type="button">
        <span class="spread-n">3</span><span class="spread-name">무엇을 할까</span></button>
      <button class="spread-btn" data-spread="choice" type="button">
        <span class="spread-n">5</span><span class="spread-name">선택</span></button>
      <button class="spread-btn" data-spread="horseshoe" type="button">
        <span class="spread-n">7</span><span class="spread-name">말굽</span></button>
      <button class="spread-btn" data-spread="celtic" type="button">
        <span class="spread-n">10</span><span class="spread-name">켈틱 크로스</span></button>
      <button class="spread-btn" data-spread="zodiac" type="button">
        <span class="spread-n">12</span><span class="spread-name">조디악</span></button>
    </div>

    <div class="fan-stage">
      <div class="fan-scroll" id="fan-scroll">
        <div class="fan" id="fan" role="group" aria-label="펼쳐진 덱 78장, 카드를 골라 뽑으세요"></div>
      </div>
      <p class="fan-swipe" id="fan-swipe" hidden>옆으로 밀어서 전체 보기</p>
      <div class="fan-tools">
        <p class="fan-hint" id="fan-hint">덱에서 카드를 고르세요 <b id="counter">0 / 1</b></p>
        <div class="fan-btns">
          <button class="btn btn-ghost" id="btn-auto" type="button">자동으로 뽑기</button>
          <button class="btn btn-ghost" id="btn-shuffle" type="button">덱 섞기</button>
        </div>
        <details class="settings" id="settings">
          <summary class="settings-toggle">설정</summary>
          <div class="settings-body">
            <button class="btn btn-toggle is-on" id="btn-rev" type="button" aria-pressed="true">역방향 켬</button>
            <button class="btn btn-toggle" id="btn-face" type="button" aria-pressed="false">앞면 보고 뽑기 끔</button>
          </div>
        </details>
      </div>
    </div>

    <div class="board" id="board" data-spread="one"></div>

    <div class="actions" id="actions" hidden>
      <button class="btn btn-ghost" id="btn-share" type="button">결과 링크 복사</button>
    </div>
  </section>

  <section class="reading" id="reading" aria-live="polite"></section>

  <section class="log" id="log" hidden>
    <div class="log-head">
      <h2 class="sec-title">지난 리딩</h2>
      <button class="btn btn-quiet" id="btn-clearlog" type="button">전체 지우기</button>
    </div>
    <ol class="log-list" id="log-list"></ol>
  </section>
</main>

<footer class="colophon">
  <p>카드 이미지는 1909년 Rider-Waite-Smith 판본, 퍼블릭 도메인입니다.</p>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
