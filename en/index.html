<!doctype html>
<!-- scripts/build-en.sh 가 index.html 에서 생성합니다. 직접 고치지 마세요. -->
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Tarot Card Reading</title>
<meta name="description" content="Free tarot with the full 78-card Rider-Waite deck. Upright and reversed meanings for every card. One card, three cards, Celtic Cross.">
<link rel="canonical" href="https://tarot.ysw.kr/en/">
<link rel="alternate" hreflang="ko" href="https://tarot.ysw.kr/">
<link rel="alternate" hreflang="en" href="https://tarot.ysw.kr/en/">
<link rel="alternate" hreflang="x-default" href="https://tarot.ysw.kr/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tarot.ysw.kr/en/">
<meta property="og:title" content="Free Tarot Card Reading">
<meta property="og:description" content="Pick a card straight from a deck fanned out in front of you.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="cardback" viewBox="0 0 120 204">
    <rect width="120" height="204" fill="#1a1330"/>
    <rect x="4" y="4" width="112" height="196" fill="none" stroke="#c9a227" stroke-width="1" opacity=".85"/>
    <rect x="8.5" y="8.5" width="103" height="187" fill="none" stroke="#c9a227" stroke-width=".5" opacity=".5"/>
    <g transform="translate(60 102)" stroke="#c9a227" fill="none">
      <circle r="30" stroke-width=".6" opacity=".55"/>
      <circle r="21" stroke-width=".6" opacity=".75"/>
      <circle r="7"  stroke-width=".8" opacity=".9"/>
      <g stroke-width=".7" opacity=".8">
        <path d="M0-30 8-8 30 0 8 8 0 30 -8 8 -30 0 -8-8Z"/>
        <path d="M0-30 8-8 30 0 8 8 0 30 -8 8 -30 0 -8-8Z" transform="rotate(45) scale(.72)"/>
      </g>
      <g stroke-width=".4" opacity=".45">
        <path d="M0-44V-34M0 34v10M-44 0h10M34 0h10"/>
      </g>
      <circle r="2" fill="#c9a227" stroke="none" opacity=".9"/>
    </g>
    <g fill="#c9a227" opacity=".7">
      <circle cx="14" cy="14" r="1.6"/><circle cx="106" cy="14" r="1.6"/>
      <circle cx="14" cy="190" r="1.6"/><circle cx="106" cy="190" r="1.6"/>
    </g>
  </symbol>
</svg>

<header class="masthead">
  <button class="lang" id="btn-lang" type="button"></button>
  <h1 class="wordmark"><span class="wordmark-ko">타로</span><span class="wordmark-en">Tarot</span></h1>
</header>

<main>
  <section class="table" aria-labelledby="table-h">
    <h2 id="table-h" class="sr-only" hidden></h2>

    <div class="spreadbar" id="spreadbar" role="group"></div>

    <div class="ask">
      <select class="ask-cat" id="ask-cat">
        <option value=""></option>
      </select>
      <input class="ask-q" id="ask-q" type="text" maxlength="60" autocomplete="off">
    </div>

    <div class="fan-stage">
      <div class="fan-scroll" id="fan-scroll">
        <div class="fan" id="fan" role="group"></div>
      </div>
      <p class="fan-swipe" id="fan-swipe" hidden></p>
      <div class="fan-tools">
        <p class="fan-hint" id="fan-hint"></p>
        <div class="fan-btns">
          <button class="btn btn-ghost" id="btn-auto" type="button"></button>
          <button class="btn btn-ghost" id="btn-shuffle" type="button"></button>
        </div>
        <details class="settings" id="settings">
          <summary class="settings-toggle" id="settings-label"></summary>
          <div class="settings-body">
            <button class="btn btn-toggle is-on" id="btn-rev" type="button" aria-pressed="true"></button>
            <button class="btn btn-toggle" id="btn-face" type="button" aria-pressed="false"></button>
          </div>
        </details>
      </div>
    </div>

    <div class="board" id="board" data-spread="one"></div>

    <div class="actions" id="actions" hidden>
      <button class="btn btn-ghost" id="btn-share" type="button"></button>
    </div>
  </section>

  <section class="reading" id="reading" aria-live="polite"></section>

  <section class="log" id="log" hidden>
    <div class="log-head">
      <h2 class="sec-title" id="log-title"></h2>
      <button class="btn btn-quiet" id="btn-clearlog" type="button"></button>
    </div>
    <ol class="log-list" id="log-list"></ol>
  </section>
</main>

<footer class="colophon">
  <p><a id="card-index" class="colo-link" href="/card/"></a></p>
  <p id="colophon"></p>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
